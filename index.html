<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>God Node V2 - Control Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto; background: linear-gradient(180deg,#f8fafc,#e6eef8); color:#0b1220; }
    .sidebar { position:fixed; left:0; top:0; bottom:0; width:260px; padding:20px; background: rgba(255,255,255,0.6); backdrop-filter: blur(6px); border-right:1px solid rgba(15,23,42,0.04);} 
    .main { margin-left:280px; padding:20px; }
    .card { border-radius:12px; }
    #viewportIframe{ width:100%; height:600px; border-radius:12px; border:1px solid rgba(15,23,42,0.06); }
    .vault-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .vault-row input{ flex:1; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h4>⚙️ GOD NODE V2</h4>
    <hr />
    <div>
      <button class="btn btn-sm btn-primary" id="btn-new-game">New Game</button>
    </div>
    <hr />
    <div>
      <h6>API Vault</h6>
      <div id="vault-categories"></div>
      <button class="btn btn-outline-secondary btn-sm" id="btn-add-vault">+ Add Key</button>
      <hr />
      <h6>My Games</h6>
      <div id="myGamesList"></div>
    </div>
  </div>

  <div class="main">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-6">
          <div class="card p-3">
            <h5>Generate Game</h5>
            <textarea id="gamePrompt" class="form-control" rows="5" placeholder="Describe the game (Hindi preferred)"></textarea>
            <div class="mt-2 d-flex gap-2">
              <button class="btn btn-success" id="btn-generate">Generate</button>
              <button class="btn btn-outline-secondary" id="btn-mic">🎙️ Mic</button>
              <select id="modelSelect" class="form-select w-auto">
                <option value="gemini">Gemini</option>
              </select>
            </div>
            <div id="generationProgress" class="mt-2" style="display:none">
              <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
              <div id="progressText" class="small mt-1"></div>
            </div>
          </div>

          <div class="card p-3 mt-3">
            <h5>Vault Sync</h5>
            <button class="btn btn-primary" id="btn-sync-vault">Sync To Server</button>
          </div>

        </div>
        <div class="col-md-6">
          <div class="card p-3">
            <h5>Live Viewport</h5>
            <iframe id="viewportIframe" sandbox="allow-scripts allow-same-origin"></iframe>
            <div class="mt-2 d-flex gap-2">
              <button class="btn btn-outline-primary" id="btn-download-zip">Download ZIP</button>
              <button class="btn btn-outline-secondary" id="btn-export-capacitor">Export (Capacitor)</button>
              <button class="btn btn-outline-secondary" id="btn-export-tauri">Export (Tauri)</button>
            </div>
          </div>

          <div class="card p-3 mt-3">
            <h5>Logs</h5>
            <div id="logContainer" style="height:180px;overflow:auto;background:#fff;padding:10px;border-radius:8px;border:1px solid rgba(11,17,34,0.04)"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
// Vault categories default
const defaultCategories = ["CORE LLM ENGINE","3D RENDERING API","AUDIO & SFX API","CLOUD STORAGE (5TB)","AD PLATFORMS & SDK"];
let vault = JSON.parse(localStorage.getItem('godnode_vault')||'{}');

function renderVault(){
  const container = document.getElementById('vault-categories'); container.innerHTML='';
  defaultCategories.forEach(cat=>{
    const el = document.createElement('div'); el.innerHTML = `<div class='vault-row'><strong style='width:160px'>${cat}</strong><input placeholder='Key or Token' data-cat='${cat}' class='form-control'/><button class='btn btn-sm btn-danger'>X</button></div>`;
    container.appendChild(el);
    const input = el.querySelector('input');
    input.value = vault[cat]||'';
    input.addEventListener('input', (e)=>{ vault[cat]=e.target.value; localStorage.setItem('godnode_vault', JSON.stringify(vault)); });
    el.querySelector('button').addEventListener('click', ()=>{ delete vault[cat]; localStorage.setItem('godnode_vault', JSON.stringify(vault)); renderVault(); });
  });
}

renderVault();

// Add custom key rows
document.getElementById('btn-add-vault').addEventListener('click', ()=>{
  const name = prompt('Key name (e.g., GEMINI_API_KEY)');
  if(!name) return; vault[name] = ''; localStorage.setItem('godnode_vault', JSON.stringify(vault)); renderVault();
});

// Sync vault to server
document.getElementById('btn-sync-vault').addEventListener('click', async ()=>{
  try{
    for(const k in vault){
      const v = vault[k];
      const serviceKey = (k.toLowerCase().includes('gemini')||k.toLowerCase().includes('google'))? 'gemini' : (k.toLowerCase().includes('openai')? 'openai' : k);
      await fetch('/api/v2/vault/store',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:serviceKey,key:v})});
    }
    alert('Vault synced to server');
  }catch(e){alert('Sync failed '+e)}
});

// My Games list
async function loadMyGames(){
  const res = await fetch('/api/v1/games'); const data = await res.json();
  const container = document.getElementById('myGamesList'); container.innerHTML='';
  (data.games||[]).forEach(g=>{
    const el = document.createElement('div'); el.innerHTML = `<div style='display:flex;justify-content:space-between;align-items:center'><div><strong>${g.game_id}</strong><div style='font-size:12px;color:#666'>${g.preview_url||''}</div></div><div><button class='btn btn-sm btn-primary' data-id='${g.game_id}'>Play</button></div></div>`;
    container.appendChild(el);
    el.querySelector('button').addEventListener('click', ()=>{ openPreview(g.game_id); });
  })
}
async function openPreview(id){ const preview = `/exports/${id}/index.html`; const iframe = document.getElementById('viewportIframe'); fetch(preview).then(r=>r.text()).then(html=>{ iframe.srcdoc = html; }); }

loadMyGames();

// Generate Game
let lastTaskId = null;
document.getElementById('btn-generate').addEventListener('click', async ()=>{
  const prompt = document.getElementById('gamePrompt').value; if(!prompt) return alert('enter prompt');
  const model = document.getElementById('modelSelect').value;
  document.getElementById('generationProgress').style.display='block'; document.getElementById('progressBar').style.width='10%'; document.getElementById('progressText').innerText='Queued';
  const res = await fetch('/api/v2/generate/game',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,game_type:'interactive'})});
  const j = await res.json(); lastTaskId = j.task_id; pollTask(lastTaskId);
});

async function pollTask(taskId){
  try{
    const r = await fetch(`/api/v2/status/${taskId}`); const j = await r.json(); const p = j.progress||0; document.getElementById('progressBar').style.width = p+'%'; document.getElementById('progressText').innerText = j.status || '';
    if(j.status === 'SUCCESS' && j.result && j.result.final_build){
      const iframe = document.getElementById('viewportIframe'); iframe.srcdoc = j.result.final_build;
      document.getElementById('generationProgress').style.display='none'; loadMyGames();
    }else if(j.status==='FAILED'){ document.getElementById('generationProgress').style.display='none'; alert('Generation failed'); }
    else setTimeout(()=>pollTask(taskId), 1200);
  }catch(e){ console.error(e); setTimeout(()=>pollTask(taskId), 2000); }
}

// Mic using Web Speech API
let recognition = null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new Rec(); recognition.lang = 'hi-IN'; recognition.interimResults = true; recognition.continuous = false;
  recognition.onresult = (e)=>{ const text = Array.from(e.results).map(r=>r[0].transcript).join(''); document.getElementById('gamePrompt').value = text; }
}
document.getElementById('btn-mic').addEventListener('click', ()=>{ if(!recognition) return alert('SpeechRecognition not available'); recognition.start(); });

// Logs SSE
function connectLogs(){
  if(typeof(EventSource)!=='undefined'){
    const es = new EventSource('/api/v2/logs');
    es.onmessage = function(e){ const container=document.getElementById('logContainer'); container.innerHTML += '<div>'+e.data+'</div>'; container.scrollTop = container.scrollHeight; }
    es.onerror = function(){ es.close(); setTimeout(connectLogs,5000); }
  } else { // polling fallback
    setInterval(async ()=>{ const r=await fetch('/api/v2/logs?recent=20'); const j=await r.json(); const c=document.getElementById('logContainer'); c.innerHTML = j.lines.join('<br/>'); c.scrollTop = c.scrollHeight; },3000);
  }
}
connectLogs();

// Exports
document.getElementById('btn-download-zip').addEventListener('click', async ()=>{ if(!lastTaskId) return alert('No build ready'); const gid = lastTaskId.replace('GAME_',''); const url = `/exports/${gid}.zip`; window.open(url,'_blank'); });

// load periodically
setInterval(loadMyGames, 30000);
</script>
</body>
</html>
