<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rio Engine - 3D Ultra Pipeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #090a10;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .main-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Top Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #131622;
            border: 1px solid #1f2438;
            border-radius: 12px;
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d2ff, #0070f3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            text-transform: uppercase;
        }

        /* Card Panels */
        .panel-card {
            background: #131622;
            border: 1px solid #1f2438;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .panel-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #798ba3;
        }

        textarea {
            width: 100%;
            height: 95px;
            background: #090a10;
            border: 1px solid #272d45;
            border-radius: 10px;
            padding: 12px;
            color: #f1f5f9;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #00d2ff, #0066ff);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 112, 243, 0.3);
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            background: #1e2336;
            color: #94a3b8;
            max-width: 110px;
        }

        /* Progress Box */
        .progress-box {
            display: none;
            background: #0d0f18;
            border: 1px solid #1f2438;
            border-radius: 12px;
            padding: 14px;
            flex-direction: column;
            gap: 8px;
        }

        .progress-box.active {
            display: flex;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #00d2ff;
        }

        .bar-track {
            width: 100%;
            height: 8px;
            background: #171b2b;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #0070f3);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px #00d2ff;
        }

        .terminal-log {
            background: #05060a;
            border: 1px solid #1a1e30;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #00ffaa;
            max-height: 85px;
            overflow-y: auto;
        }

        /* 3D Viewport Frame */
        .viewport-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 40px;
        }

        .viewport-wrapper {
            width: 100%;
            height: 480px;
            background: #000;
            border: 2px solid #00d2ff;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        
        <!-- Header -->
        <div class="app-header">
            <div class="app-title">🚀 Rio Ultra-Fast V2</div>
            <div class="status-badge" id="engineStatus">Ready</div>
        </div>

        <!-- Prompt Panel -->
        <div class="panel-card">
            <div class="panel-label">Game Description & Mechanics</div>
            <textarea id="promptInput" placeholder="Describe your 3D game...">Create a fast-paced space shooter with moving stars, player ship controls, and laser projectiles using Three.js</textarea>
            
            <div class="btn-group">
                <button class="btn-generate" id="genBtn" onclick="triggerBuild()">⚡ GENERATE GAME</button>
                <button class="btn-clear" onclick="document.getElementById('promptInput').value=''">CLEAR</button>
            </div>
        </div>

        <!-- Progress Box -->
        <div class="progress-box" id="progressCard">
            <div class="progress-info">
                <span id="progressMessage">Initializing...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="bar-track">
                <div class="bar-fill" id="progressFill"></div>
            </div>
            <div class="terminal-log" id="logWindow">[SYSTEM] Ready for next build task.</div>
        </div>

        <!-- 3D Canvas Viewport -->
        <div class="viewport-section" id="viewportTarget">
            <div class="panel-label">🎮 Live 3D WebGL Viewport</div>
            <div class="viewport-wrapper">
                <iframe id="viewportFrame" srcdoc="<body style='margin:0;background:#05060a;color:#556;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;'>Press Generate to start 3D Viewport</body>"></iframe>
            </div>
        </div>

    </div>

    <script>
        function log(msg) {
            const logWin = document.getElementById('logWindow');
            const time = new Date().toLocaleTimeString();
            logWin.innerHTML += `<br>[${time}] ${msg}`;
            logWin.scrollTop = logWin.scrollHeight;
        }

        async function triggerBuild() {
            const promptText = document.getElementById('promptInput').value.trim();
            if (!promptText) return;

            const genBtn = document.getElementById('genBtn');
            const progressCard = document.getElementById('progressCard');
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
            const progressMessage = document.getElementById('progressMessage');
            const engineStatus = document.getElementById('engineStatus');
            const viewportFrame = document.getElementById('viewportFrame');
            const viewportTarget = document.getElementById('viewportTarget');

            genBtn.disabled = true;
            progressCard.classList.add('active');
            progressFill.style.width = '10%';
            progressPercent.innerText = '10%';
            progressMessage.innerText = 'Dispatching to Orchestrator...';
            engineStatus.innerText = 'Building';
            engineStatus.style.color = '#ffaa00';
            log('Starting real-time generation stream...');

            try {
                const response = await fetch('/api/v2/generate/game', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText })
                });

                if (!response.ok) throw new Error('Generation endpoint error: ' + response.statusText);

                const data = await response.json();
                const taskId = data.task_id;
                log('Task ID assigned: ' + taskId.substring(0, 10) + '...');

                const eventSource = new EventSource('/api/v2/stream/pipeline/' + taskId);

                eventSource.onmessage = function(event) {
                    try {
                        const payload = JSON.parse(event.data);

                        if (payload.type === 'progress') {
                            progressFill.style.width = payload.percentage + '%';
                            progressPercent.innerText = payload.percentage + '%';
                            progressMessage.innerText = payload.message;
                            log(payload.message);
                        } 
                        else if (payload.type === 'complete') {
                            progressFill.style.width = '100%';
                            progressPercent.innerText = '100%';
                            progressMessage.innerText = 'Build Assembled!';
                            engineStatus.innerText = 'Live';
                            engineStatus.style.color = '#00ffaa';
                            log('Build completed. Injecting into 3D Viewport...');

                            eventSource.close();
                            genBtn.disabled = false;

                            if (payload.result && payload.result.final_build) {
                                viewportFrame.srcdoc = payload.result.final_build;
                                
                                // Auto scroll to game window smoothly
                                setTimeout(() => {
                                    viewportTarget.scrollIntoView({ behavior: 'smooth' });
                                }, 250);
                            }
                        } 
                        else if (payload.type === 'error') {
                            progressMessage.innerText = 'Build Error';
                            engineStatus.innerText = 'Failed';
                            engineStatus.style.color = '#ff4444';
                            log('Error: ' + payload.error);
                            eventSource.close();
                            genBtn.disabled = false;
                        }
                    } catch(err) {}
                };

                eventSource.onerror = function() {
                    eventSource.close();
                    genBtn.disabled = false;
                };

            } catch (err) {
                log('Network error: ' + err.message);
                engineStatus.innerText = 'Error';
                engineStatus.style.color = '#ff4444';
                genBtn.disabled = false;
            }
        }
    </script>
</body>
    </html>
